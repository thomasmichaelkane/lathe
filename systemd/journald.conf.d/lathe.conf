# Cap the systemd journal. Deployed to /etc/systemd/journald.conf.d/lathe.conf.
#
# The Pi boots from a microSD card, and the journal is one of the few things
# still writing to it — everything with sustained writes (the library, the
# SQLite databases, lathe's own logs) lives on the library drive under /srv.
# The default allowance is 10% of the filesystem, roughly 2.8GB on this card,
# which is far more history than a single-purpose box needs and far more wear
# than it is worth. Kept persistent rather than volatile so a problem that
# caused a reboot can still be read after it.
#
# Safe to get wrong: journald ignores keys it does not understand rather than
# refusing to start, so a typo here cannot stop the machine booting.

[Journal]
SystemMaxUse=200M
