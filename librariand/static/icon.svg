<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- librariand: a record — two grooves and the label with its spindle
       hole. The dashboard's one loud colour on its background, and nothing
       thinner than survives being a 16px favicon. -->
  <rect width="64" height="64" fill="#0a0a0a"/>
  <g fill="none" stroke="#d4f21a">
    <circle cx="32" cy="32" r="25" stroke-width="5"/>
    <circle cx="32" cy="32" r="16.5" stroke-width="3"/>
  </g>
  <circle cx="32" cy="32" r="8.5" fill="#d4f21a"/>
  <circle cx="32" cy="32" r="2.5" fill="#0a0a0a"/>
</svg>
