# abcde configuration for automatic ripping.
#
# Deployed to /etc/abcde.conf. Tuned for speed over archival paranoia — see
# §6.2 of docs/plan.md for the tradeoff and its mitigation.
#
# autorip.sh layers a small per-run config on top of this with `abcde -c`,
# overriding OUTPUTDIR and CDROM so each disc rips into its own work directory.
# That keeps two drives from colliding and means the finished album can be
# located without parsing abcde's naming.

CDROM=/dev/sr0
OUTPUTTYPE=flac
FLACOPTS='-5'

# Default only. autorip.sh overrides this per run; a bare `abcde` invocation
# still lands somewhere sensible rather than the current directory.
OUTPUTDIR=/srv/staging/rips

CDDBMETHOD=musicbrainz
CDDBLOCALRECURSIVE=n

# Fast path: no re-read retries on bad sectors. A scratched disc rips quickly
# but may contain silent errors, so autorip.sh scans the output for read
# failures and flags the disc for a manual re-rip.
CDPARANOIAOPTS="-Z"

ACTIONS=cddb,read,encode,tag,move,clean
INTERACTIVE=n

# Deliberately NOT EJECTCD=y. autorip.sh ejects, and only after the album has
# been moved into /srv/inbox. The tray opening is the "this disc is done"
# signal (§6.4) — if abcde ejected on its own, the tray would open before the
# hand-off, and a failed move would look exactly like a success.
EJECTCD=n

# All four Pi cores for FLAC encoding. Encoding finishes before reading does,
# so ripping stays drive-bound at roughly 5–10 minutes per disc.
MAXPROCS=4

OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} ${TRACKFILE}'
VAOUTPUTFORMAT='Various/${ALBUMFILE}/${TRACKNUM} ${ARTISTFILE} - ${TRACKFILE}'
