# Releases are cut by hand from main:
#
#   git tag 0.1.0 && git push origin 0.1.0
#
# Pushing a tag shaped like x.y.z runs every test suite and, only if they all
# pass, publishes a GitHub release with notes generated from the merged PRs.
# Pull requests run the same test job, so the thing that gates a release has
# already run many times before the first tag is ever pushed.

name: release

on:
  push:
    # GitHub filter syntax: `+` is "one or more of the preceding", `.` is
    # literal. So 0.1.0 and 10.20.30 match; v0.1.0 and 0.1 do not.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The Pi runs Raspberry Pi OS on Debian trixie, which ships Python 3.13.
      # Testing on the runner's default instead would be testing a machine
      # nobody deploys to.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ffmpeg fabricates the tagged FLACs the quarantine and librariand suites
      # read. Mocking tag reads instead would be testing the mock.
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # The same pinned file install.sh deploys from, so what passes here is
      # what the Pi installs.
      - name: librariand's venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r librariand/requirements.txt

      # beets as the Pi will run it: the pinned venv, then the same health check
      # install.sh runs after every deploy. beets drops a plugin it cannot load
      # and exits 0, so without this a bad pin would ship and be discovered as
      # imports that quietly stop matching. ffmpeg is installed above because
      # the replaygain plugin refuses to load without it.
      - name: beets
        run: |
          python -m venv "$RUNNER_TEMP/beets"
          "$RUNNER_TEMP/beets/bin/pip" install --quiet --disable-pip-version-check -r ingest/beets/requirements.txt
          PLUGINPATH="$PWD/ingest/beets/plugins" \
            ./ingest/beets-check.sh "$RUNNER_TEMP/beets/bin/beet" ingest/beets/config.yaml

      # The venv goes first on PATH so the suites that invoke `python3` get
      # mediafile; librariand-test.sh finds .venv on its own.
      - name: Tests
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          ./install-test.sh
          ./ingest/autorip-test.sh
          ./ingest/inbox-import-test.sh
          ./librariand/quarantine-test.sh
          ./librariand/librariand-test.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag pushed from a feature branch would otherwise publish a release of
      # code that was never merged. Releases are cut from main; enforce it.
      - name: Tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
